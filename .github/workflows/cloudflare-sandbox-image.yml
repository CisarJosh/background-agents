name: Cloudflare sandbox image

# Builds, checks and pushes the sandbox image for the cloudflare sandbox provider. The image must
# be built on native amd64, so this runs here rather than on a contributor's machine.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "cloudflare-sandbox-image-*"
    paths:
      - "packages/cloudflare-infra/**"
      - ".github/workflows/cloudflare-sandbox-image.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
      # With a registry credential the image is pushed. Without one it is saved as an artifact,
      # to be loaded and pushed from a machine that has a credential.
      - name: Build, check, and push or save
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REGISTRY_PASSWORD: ${{ secrets.CLOUDFLARE_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_REGISTRY_PASSWORD" ]; then
            export OPENINSPECT_IMAGE_ARCHIVE="$RUNNER_TEMP/openinspect-sandbox.tar"
          fi
          python3 packages/sandbox-images/cli.py build --provider cloudflare --output "$RUNNER_TEMP/image.json"
          cat "$RUNNER_TEMP/image.json" | sed -E 's#registry.cloudflare.com/[^/]+/##' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OPENINSPECT_IMAGE_ARCHIVE" ]; then
            zstd -T0 -3 --rm "$OPENINSPECT_IMAGE_ARCHIVE"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: openinspect-sandbox-image
          path: ${{ runner.temp }}/openinspect-sandbox.tar.zst
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
